services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: xiaohongshu-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: xiaohongshu
      MYSQL_CHARSET: utf8mb4
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/sql/schema-ddl.sql:/docker-entrypoint-initdb.d/01-schema-ddl.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - xiaohongshu-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: xiaohongshu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - xiaohongshu-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==================== MinIO 文件存储 ====================
  minio:
    image: minio/minio:latest
    container_name: xiaohongshu-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - xiaohongshu-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 后端服务 ====================
  backend:
    image: ${ALIYUN_REGISTRY}/qwe5283/xiaohongshu-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xiaohongshu-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 激活 Docker 环境配置（覆盖 application.yml 中的连接地址）
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_URL: ${MYSQL_DOCKER_URL}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_DOCKER_HOST: ${REDIS_DOCKER_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      MINIO_ENDPOINT: ${MINIO_DOCKER_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      # LLM (OpenAI 兼容接口，DeepSeek)
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE}
      # JVM 参数
      JAVA_OPTS: "-Xms256m -Xmx512m"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - xiaohongshu-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8080/api/post/list?pageNum=1&pageSize=1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==================== 前端服务 ====================
  frontend:
    image: ${ALIYUN_REGISTRY}/qwe5283/xiaohongshu-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xiaohongshu-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - xiaohongshu-net

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  xiaohongshu-net:
    driver: bridge
