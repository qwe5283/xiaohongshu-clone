name: Build & Deploy FullStack

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  BACKEND_IMAGE: ${{ secrets.ACR_REGISTRY }}/qwe5283/xiaohongshu-backend
  FRONTEND_IMAGE: ${{ secrets.ACR_REGISTRY }}/qwe5283/xiaohongshu-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    
    steps:
      - uses: actions/checkout@v4

      # 检测哪些目录有变更，避免无效构建
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 构建后端（仅在 backend 目录有变更时）
      - name: Build & Push Backend
        if: steps.filter.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建前端（仅在 frontend 目录有变更时）
      - name: Build & Push Frontend
        if: steps.filter.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Aliyun Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e  # 任何命令失败立即退出
            
            cd ${{ secrets.DEPLOY_PATH }}
            
            # 登录 ACR
            echo "${{ secrets.ACR_PASSWORD }}" | \
              docker login ${{ secrets.ACR_REGISTRY }} \
              -u ${{ secrets.ACR_USERNAME }} --password-stdin
            
            # 写入本次部署的镜像 Tag
            export ALIYUN_REGISTRY=${{ secrets.ACR_REGISTRY }}
            export IMAGE_TAG=${{ github.sha }}
            
            # 拉取最新镜像
            docker compose pull backend frontend
            
            # 仅重启应用容器，MySQL/Redis/MinIO 完全不受影响
            docker compose up -d --no-deps --remove-orphans backend frontend
            
            # 等待健康检查（可选但推荐）
            sleep 5
            docker compose ps
            
            # 清理旧镜像，释放磁盘空间
            docker image prune -af --filter "until=168h"
            
            echo "✅ Deployment completed: ${{ github.sha }}"
